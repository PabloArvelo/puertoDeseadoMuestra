spring.application.name=PuerdoDeseado
server.port=8080

#spring.profiles.active=deploy


spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.datasource.url=${DB_URL}
#spring.datasource.url=${DB_URL_PRUEBAS}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}

#configura el tiempo activo de sesion en minutos
server.servlet.session.timeout=20m


#configuraciones de HikariCP (para prevenir problemas de conexion a MySQL):
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=-1


hibernate.use_jaxb=false
hibernate.allow_jaxb=false


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=false


# ---------- IMPLEMENTACION DE COOKIES SEGURAS ------------
#Evita que JavaScript acceda a la cookie, protegiendo contra ataques XSS que intenten robarla (aunque ya estás protegido contra XSS).
server.servlet.session.cookie.http-only=true

#Asegura que la cookie solo se invie en conexiones HTTPS, lo que es compatible con tu configuracion de Nginx.
# -------------- para produccion --------------
#server.servlet.session.cookie.secure=true
# -------------- para desarrollo --------------
server.servlet.session.cookie.secure=false

#Previene que la cookie se envie en solicitudes iniciadas por sitios externos, mitigando ciertos ataques CSRF (aunque ya tienes proteccion CSRF activa).
server.servlet.session.cookie.same-site=strict


# ---------- MANEJA EL ENVIO AUTOMATICO DE EMAILS ------------

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_FROM}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# ---------- PARA LA API DE LOS PDFs ------------
api.key=${DOCRAPTOR_KEY}
api.test=${DOCRAPTOR_TEST}


# ---------- PARA MIGRACIONES DE ESQUEMAS DE BASE DE DATOS ------------

# Configuracion de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true



#logging.level.org.springframework.security=DEBUG
