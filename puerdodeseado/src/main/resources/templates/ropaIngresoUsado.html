<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

   <title>Ingreso Uniformes-Usados</title>

   <link rel="icon" type="image/png" th:href="@{/img/iconos/favicon.png}">

   
   <link rel="stylesheet" href="/css/ropaIngresoCompra.css">

                  <th id="thTalle">TALLE</th>
                  <th id="thCantidad">CANTIDAD</th>

               </tr>
            </thead>

            <tbody>
            </tbody>

         <div>
